    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      - 🇨🇳 台湾节点
      - 🇭🇰 香港节点
  - name: 🐙 GitHub
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇺🇸 美国节点
      - DIRECT
  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      - 🚀 节点选择
      - 🇺🇸 美国节点
  - name: 🍎 苹果服务
    type: select
    proxies:
      - DIRECT
      - ♻️ 自动选择
      - 🚀 节点选择
      - 🇺🇸 美国节点
  - name: 🎮 游戏平台
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      - 🚀 节点选择
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
  - name: 🇭🇰 香港节点
    type: url-test
    include-all: true
    filter: "(?i)港|HK|Hong Kong|香港"
    exclude-filter: "(?i)剩余|到期|导航|倍率"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇯🇵 日本节点
    type: url-test
    include-all: true
    filter: "(?i)日本|东京|大阪|JP|Japan"
    exclude-filter: "(?i)剩余|到期|导航|倍率"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇺🇸 美国节点
    type: url-test
    include-all: true
    filter: "(?i)美|US|United States|America"
    exclude-filter: "(?i)剩余|到期|导航|倍率"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇨🇳 台湾节点
    type: url-test
    include-all: true
    filter: "(?i)台|TW|Taiwan"
    exclude-filter: "(?i)剩余|到期|导航|倍率"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇸🇬 狮城节点
    type: url-test
    include-all: true
    filter: "(?i)新加坡|SG|Singapore"
    exclude-filter: "(?i)剩余|到期|导航|倍率"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇰🇷 韩国节点
    type: url-test
    include-all: true
    filter: "(?i)韩|KR|Korea|首尔"
    exclude-filter: "(?i)剩余|到期|导航|倍率"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

