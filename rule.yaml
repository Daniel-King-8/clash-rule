proxy-groups:
  - name: 🎮 Pokémon 游戏
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
      - 🇨🇳 台湾节点
      - 🇸🇬 狮城节点
      - 🇰🇷 韩国节点
      - 🚀 手动切换
      - DIRECT
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
      - 🇨🇳 台湾节点
      - 🇸🇬 狮城节点
      - 🇰🇷 韩国节点
      - 🚀 手动切换
      - DIRECT
  - name: 🚀 手动切换
    type: select
    include-all: true
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    exclude-filter: "(?i)剩余|到期|导航|倍率"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 💬 AI服务
    type: select
    proxies:
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🚀 节点选择
      - 🚀 手动切换
  - name: 🐦 推特X
    type: select
    proxies:
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - ♻️ 自动选择
      - 🚀 节点选择
      - 🚀 手动切换
  - name: 📲 电报消息
    type: select
    proxies:
      - 🚀 节点选择
      - 🇸🇬 狮城节点
      - 🇭🇰 香港节点
      - ♻️ 自动选择
      - 🚀 手动切换
  - name: 📹 油管视频
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
  - name: 🎥 奈飞视频
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇸🇬 狮城节点
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🚀 节点选择
  - name: 🎵 Spotify
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚀 节点选择
      - 🇺🇸 美国节点
      - 🇭🇰 香港节点
      - DIRECT
  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
